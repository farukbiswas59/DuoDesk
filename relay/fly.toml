# Fly.io: cd relay && fly launch --copy-config --name <your-relay-name> && fly deploy
# Optional access token: fly secrets set RELAY_TOKEN=<something long>
app = "duodesk-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # the computers keep a socket open: never stop under them
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
